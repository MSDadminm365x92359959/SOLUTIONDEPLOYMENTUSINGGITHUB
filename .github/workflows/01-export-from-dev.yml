name: 01 - Export Solution from DEV

on:
  workflow_dispatch:
    inputs:
      solution_name:
        description: "GITHUBSOLUTIONFORDEPLOYMENT"
        required: true

permissions:
  contents: write

jobs:
  export-solution:
    runs-on: windows-latest

    steps:

      # Step 1
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2
      - name: Export unmanaged solution from DEV
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ secrets.DEV_ENV_URL }}
          app-id: ${{ secrets.DEV_CLIENT_ID }}
          client-secret: ${{ secrets.DEV_CLIENT_SECRET }}
          tenant-id: ${{ secrets.DEV_TENANT_ID }}
          solution-name: ${{ github.event.inputs.solution_name }}
          solution-output-file: out/${{ github.event.inputs.solution_name }}.zip

      # Step 3
      - name: Unpack solution
        uses: microsoft/powerplatform-actions/unpack-solution@v1
        with:
          solution-file: out/${{ github.event.inputs.solution_name }}.zip
          solution-folder: solutions/${{ github.event.inputs.solution_name }}
          solution-type: Unmanaged
          overwrite-files: true

      # Step 4
      - name: Commit changes to GitHub
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add solutions/
          git diff --staged --quiet || git commit -m "Export ${{ github.event.inputs.solution_name }} from DEV"
          git push
